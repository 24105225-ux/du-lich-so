server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    root /var/www/html/public;
    index index.php;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'self'" always;

    gzip on;

    gzip_types
        text/css
        application/javascript
        application/json
        image/svg+xml;

    location ~* \.(css|js|jpg|jpeg|png|webp|svg|woff2)$ {
        expires 30d;

        add_header
            Cache-Control
            "public, immutable";
    }

    client_max_body_size 8m;

    location / {
        try_files
            $uri
            $uri/
            /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param
            SCRIPT_FILENAME
            $document_root$fastcgi_script_name;
    }

    location ~ /\.(env|git) {
        deny all;
    }
}
